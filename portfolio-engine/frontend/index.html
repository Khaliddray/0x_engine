<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yahaya Khalid — Product Builder & Backend Engineer</title>
  <meta name="description" content="I build purposeful digital products that turn complex problems into practical, scalable solutions." />
  
  <!-- Google Fonts: Playfair Display (Serif), Inter (Sans), JetBrains Mono (Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'Cambria', 'serif'],
            sans: ['"Inter"', '"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],

            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    :root {
      color-scheme: dark;
    }
    body {
      font-family: "Inter", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #050505;
      background-image: 
        radial-gradient(circle at 50% 0%, #1f0b02 0%, #0d0602 35%, #050505 70%);
      background-attachment: fixed;
      color: #f5f5f5;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      overflow-x: hidden;
    }

    .editorial-heading {
      font-family: "Playfair Display", Georgia, Cambria, serif;
      letter-spacing: -0.015em;
    }

    /* Ambient Radial Glows (Fiery orange ambiance on obsidian black) */
    .glow-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      transform: translateZ(0);
    }
    .radial-glow-hero {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 1050px;
      height: 750px;
      background: radial-gradient(ellipse 70% 55% at 50% 28%, rgba(249, 115, 22, 0.16) 0%, rgba(234, 88, 12, 0.05) 50%, rgba(5, 5, 5, 0) 75%);
    }
    .radial-glow-mid {
      position: absolute;
      top: 35%;
      right: -200px;
      width: 850px;
      height: 850px;
      background: radial-gradient(circle 500px at center, rgba(249, 115, 22, 0.10) 0%, rgba(194, 65, 12, 0.03) 50%, transparent 70%);
    }
    .radial-glow-bottom {
      position: absolute;
      bottom: 5%;
      left: -150px;
      width: 850px;
      height: 850px;
      background: radial-gradient(circle 500px at center, rgba(234, 88, 12, 0.12) 0%, rgba(154, 52, 18, 0.03) 50%, transparent 70%);
    }

    /* Tactile Grain Noise Overlay */
    .tactile-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Hairline Structural Framing & Glass Cards */
    .glass-card {
      background: rgba(18, 16, 15, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(249, 115, 22, 0.12);
      position: relative;
    }
    .glass-card:hover {
      border-color: rgba(249, 115, 22, 0.45);
      box-shadow: 0 10px 30px -10px rgba(249, 115, 22, 0.14);
    }
    .hairline-border {
      border: 1px solid rgba(249, 115, 22, 0.12);
    }
    .hairline-b {
      border-bottom: 1px solid rgba(249, 115, 22, 0.12);
    }
    .hairline-t {
      border-top: 1px solid rgba(249, 115, 22, 0.12);
    }

    /* Corner Accent Marks */
    .corner-mark::before {
      content: '+';
      position: absolute;
      top: -9px;
      left: -6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(249, 115, 22, 0.75);
      pointer-events: none;
    }
    .corner-mark::after {
      content: '+';
      position: absolute;
      bottom: -9px;
      right: -6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: rgba(249, 115, 22, 0.75);
      pointer-events: none;
    }

    /* Marquee animation */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 28s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }
  </style>
</head>
<body class="min-h-screen bg-dark-bg text-stone-100 selection:bg-brand-500 selection:text-black relative">
  <!-- Architectural Background Layers -->
  <div class="glow-canvas">
    <div class="radial-glow-hero"></div>
    <div class="radial-glow-mid"></div>
    <div class="radial-glow-bottom"></div>
  </div>
  <div class="tactile-grain"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Icons ---
    const CodeIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
      </svg>
    );

    const ExternalLinkIcon = () => (
      <svg className="w-3.5 h-3.5 inline-block ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
      </svg>

    const GitHubIcon = () => (
      <svg className="w-4 h-4 inline-block mr-1.5" fill="currentColor" viewBox="0 0 24 24">
        <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
    );

    const DownloadIcon = () => (
      <svg className="w-4 h-4 inline-block mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
    );

    const CheckIcon = () => (
      <svg className="w-4 h-4 inline-block mr-1 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"/>
      </svg>
    );

    const CopyIcon = () => (
      <svg className="w-3.5 h-3.5 inline-block mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"/>
      </svg>
    );

    const CloseIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    );

    const SearchIcon = () => (
      <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
    );

    const MenuIcon = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16m-7 6h7"/>
      </svg>
    );

    const ArrowUpRight = () => (
      <svg className="w-4 h-4 ml-1 transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 17L17 7M17 7H7M17 7V17"/>
      </svg>
    );

    // --- Main Application Component ---
    function App() {
      const getInitialSlug = () => {
        try {
          const path = window.location.pathname;
          const match = path.match(/^\/portfolio\/([^/]+)/);
          if (match && match[1]) {
            return decodeURIComponent(match[1]);
          }
        } catch (e) {}
        return "khalid";
      };

      const [slug, setSlug] = useState(getInitialSlug);
      const [portfolio, setPortfolio] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      // Filtering and Search State
      const [activeCategory, setActiveCategory] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedProject, setSelectedProject] = useState(null);

      // Feedback states
      const [copiedEmail, setCopiedEmail] = useState(false);
      const [copiedCurl, setCopiedCurl] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Contact Form State
      const [contactForm, setContactForm] = useState({
        name: "",
        email: "",
        subject: "",
        message: "",
      });
      const [contactSubmitting, setContactSubmitting] = useState(false);
      const [contactStatus, setContactStatus] = useState(null);

      useEffect(() => {
        fetchPortfolio(slug);
      }, [slug]);

      const fetchPortfolio = async (targetSlug) => {
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`/api/public/portfolios/${targetSlug}`);
          if (!res.ok) {
            if (res.status === 404) {
              throw new Error(`Portfolio with slug "${targetSlug}" was not found.`);
            }
            throw new Error(`Failed to load portfolio (HTTP ${res.status})`);
          }
          const data = await res.json();
          setPortfolio(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleCopyEmail = (e) => {
        e.preventDefault();
        navigator.clipboard.writeText("khalidzak21@gmail.com");
        setCopiedEmail(true);
        setTimeout(() => setCopiedEmail(false), 2500);
      };

      const handleCopyCurl = (e) => {
        e.preventDefault();
        const curlCmd = `curl -s ${window.location.origin}/api/public/portfolios/${slug}`;
        navigator.clipboard.writeText(curlCmd);
        setCopiedCurl(true);
        setTimeout(() => setCopiedCurl(false), 2500);
      };

      const handleContactSubmit = async (e) => {
        e.preventDefault();
        setContactSubmitting(true);
        setContactStatus(null);

        try {
          const res = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(contactForm),
          });

          if (!res.ok) {
            throw new Error(`Inquiry submission failed (HTTP ${res.status})`);
          }

          const data = await res.json();
          setContactStatus({
            type: "success",
            message: data.message || "Your inquiry has been logged! Yahaya Khalid will follow up shortly.",
          });
          setContactForm({ name: "", email: "", subject: "", message: "" });
        } catch (err) {
          // Fallback to mailto if API fails
          window.location.href = `mailto:khalidzak21@gmail.com?subject=${encodeURIComponent(contactForm.subject || "Engineering Inquiry")}&body=${encodeURIComponent(`From: ${contactForm.name} (${contactForm.email})\n\n${contactForm.message}`)}`;
          setContactStatus({
            type: "info",
            message: "Opened your default email client to send your message directly.",
          });
        } finally {
          setContactSubmitting(false);
        }
      };

      // Filtered projects
      const filteredProjects = useMemo(() => {
        if (!portfolio || !portfolio.projects) return [];

        return portfolio.projects.filter((p) => {
          // Category filter
          if (activeCategory === "featured" && !p.is_featured) return false;

          // Search query filter
          if (searchQuery.trim() !== "") {
            const query = searchQuery.toLowerCase();
            const titleMatch = p.title.toLowerCase().includes(query);
            const descMatch = (p.description || "").toLowerCase().includes(query);
            const techMatch = (p.technologies || []).some(t => t.name.toLowerCase().includes(query));
            if (!titleMatch && !descMatch && !techMatch) return false;
          }

          return true;
        });
      }, [portfolio, activeCategory, searchQuery]);

      // Verified architecture ticker technologies
      const tickerTechs = [
        "Python", "FastAPI", "PostgreSQL", "SQLAlchemy", "Alembic", 
        "Pydantic", "REST APIs", "Pytest", "Docker", "Git & GitHub"
      ];

      return (
        <div className="min-h-screen flex flex-col justify-between relative">
          {/* Header */}
          <header className="sticky top-0 z-50 backdrop-blur-md bg-dark-bg/80 hairline-b">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
              <a href="#hero" className="flex items-center space-x-3 group">
                <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 via-orange-500 to-amber-400 flex items-center justify-center font-bold text-xs font-mono text-black shadow-lg shadow-brand-500/25 group-hover:scale-105 transition-transform">
                  YK
                </div>
                <div className="text-left">
                  <div className="font-semibold text-sm leading-tight text-white flex items-center gap-1.5">
                    <span>Yahaya Khalid</span>
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  </div>
                  <div className="text-[11px] text-slate-400 font-mono">Product Builder & Backend Engineer</div>
                </div>
              </a>

              {/* Desktop Nav */}
              <nav className="hidden md:flex items-center space-x-7 text-xs font-mono text-slate-300">
                <a href="#about" className="hover:text-brand-400 transition-colors">01 // ABOUT</a>
                <a href="#projects" className="hover:text-brand-400 transition-colors">02 // PROJECTS</a>
                <a href="#stack" className="hover:text-brand-400 transition-colors">03 // STACK</a>
                <a href="#journey" className="hover:text-brand-400 transition-colors">04 // JOURNEY</a>
                <a href="#contact" className="hover:text-brand-400 transition-colors">05 // CONTACT</a>
              </nav>

              {/* Header Right Actions */}
              <div className="flex items-center space-x-3">
                <button
                  onClick={handleCopyCurl}
                  title="Copy API curl command"
                  className="hidden sm:inline-flex items-center px-2.5 py-1.5 rounded-md text-xs font-mono text-slate-300 bg-white/5 border border-white/10 hover:bg-white/10 transition-all"
                >
                  {copiedCurl ? (
                    <>
                      <CheckIcon />
                      <span className="text-emerald-400 font-medium">Copied cURL!</span>
                    </>
                  ) : (
                    <>
                      <CopyIcon />
                      <span>API cURL</span>
                    </>
                  )}
                </button>

                <a 
                  href="/docs" 
                  target="_blank" 
                  className="px-3 py-1.5 rounded-md text-xs font-mono font-medium text-brand-300 bg-brand-500/10 border border-brand-500/20 hover:bg-brand-500/20 transition-all flex items-center"
                >
                  <CodeIcon />
                  <span className="ml-1.5">Swagger API</span>
                </a>

                {/* Mobile Menu Toggle */}
                <button 
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className="md:hidden p-2 rounded-lg text-slate-300 hover:text-white bg-white/5 border border-white/10"
                >
                  <MenuIcon />
                </button>
              </div>
            </div>

            {/* Mobile Dropdown Menu */}
            {mobileMenuOpen && (
              <div className="md:hidden bg-dark-surface/95 backdrop-blur-xl hairline-b px-6 py-4 space-y-3 font-mono text-xs">
                <a 
                  href="#about" 
                  onClick={() => setMobileMenuOpen(false)}
                  className="block py-1.5 text-slate-300 hover:text-brand-400"
                >
                  01 // ABOUT
                </a>
                <a 
                  href="#projects" 
                  onClick={() => setMobileMenuOpen(false)}
                  className="block py-1.5 text-slate-300 hover:text-brand-400"
                >
                  02 // PROJECTS
                </a>
                <a 
                  href="#stack" 
                  onClick={() => setMobileMenuOpen(false)}
                  className="block py-1.5 text-slate-300 hover:text-brand-400"
                >
                  03 // STACK
                </a>
                <a 
                  href="#journey" 
                  onClick={() => setMobileMenuOpen(false)}
                  className="block py-1.5 text-slate-300 hover:text-brand-400"
                >
                  04 // JOURNEY
                </a>
                <a 
                  href="#contact" 
                  onClick={() => setMobileMenuOpen(false)}
                  className="block py-1.5 text-slate-300 hover:text-brand-400"
                >
                  05 // CONTACT
                </a>
              </div>
            )}
          </header>

          {/* Main Content Area */}
          <main className="max-w-6xl mx-auto px-4 sm:px-6 py-8 w-full flex-grow">
            {loading && (
              <div className="py-32 text-center">
                <div className="inline-block w-10 h-10 border-2 border-brand-500/20 border-t-brand-400 rounded-full animate-spin"></div>
                <p className="mt-4 text-slate-400 font-mono text-xs tracking-wider">CONNECTING TO PORTFOLIO ENGINE API...</p>
              </div>
            )}

            {error && (
              <div className="glass-card rounded-2xl p-8 max-w-2xl mx-auto my-16 text-center border-rose-500/30">
                <div className="w-12 h-12 bg-rose-500/10 text-rose-400 rounded-xl flex items-center justify-center mx-auto mb-4 font-mono text-lg">
                  !
                </div>
                <h2 className="text-xl font-bold text-white mb-2">Portfolio Data Unavailable</h2>
                <p className="text-slate-400 text-sm mb-6">{error}</p>
                <div className="p-4 bg-dark-bg/90 rounded-lg text-left text-xs font-mono text-slate-300 mb-6 border border-white/5">
                  <p className="text-slate-500 mb-2"># Quick Setup: Seed the database with demo data</p>
                  <p className="text-brand-400 select-all font-semibold">python backend/scripts/seed_data.py</p>
                </div>
                <div className="flex items-center justify-center space-x-4">
                  <button 
                    onClick={() => fetchPortfolio(slug)} 
                    className="px-4 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-sm font-medium transition"
                  >
                    Retry Connection
                  </button>
                  <a 
                    href="/docs" 
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-medium transition"
                  >
                    Open API Docs (/docs)
                  </a>
                </div>
              </div>
            )}

            {!loading && !error && portfolio && (
              <div>
                {/* Hero Section */}
                <section id="hero" className="py-12 sm:py-20 flex flex-col sm:flex-row items-center justify-between gap-10">
                  <div className="max-w-2xl text-center sm:text-left">
                    <div className="inline-flex items-center space-x-2.5 px-3 py-1 rounded-full text-xs font-mono bg-brand-500/10 text-brand-300 border border-brand-500/20 mb-6">
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                      <span>FastAPI REST Core Active</span>
                    </div>

                    <div className="text-sm font-mono text-brand-400 uppercase tracking-widest mb-3 font-semibold">
                      Yahaya Khalid — Product Builder & Backend Engineer
                    </div>

                    <h1 className="text-4xl sm:text-6xl lg:text-[68px] font-serif font-medium tracking-tight text-white mb-6 leading-[1.12]">
                      I build <span className="italic font-normal text-brand-300">purposeful</span> digital products that turn complex problems into practical, scalable solutions.
                    </h1>

                    <p className="text-base sm:text-lg text-slate-300 font-normal leading-relaxed mb-8">
                      I'm a software developer and product builder focused on building useful software, designing maintainable backend systems, and turning ideas into working products. I value clean architecture, practical problem-solving, and software that can grow with its purpose.
                    </p>

                    <div className="flex flex-wrap items-center gap-4 justify-center sm:justify-start">
                      <a 
                        href="#projects" 
                        className="px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium text-sm transition-all shadow-lg shadow-brand-600/25 flex items-center group"
                      >
                        <span>Explore Projects</span>
                        <ArrowUpRight />
                      </a>

                      <a 
                        href="#contact" 
                        className="px-5 py-2.5 rounded-lg glass-card hover:bg-dark-card text-slate-200 font-medium text-sm transition-all flex items-center"
                      >
                        <span>Get In Touch</span>
                      </a>

                      {portfolio.resume && portfolio.resume.file_url && (
                        <a 
                          href={portfolio.resume.file_url} 
                          target="_blank" 
                          rel="noreferrer"
                          className="px-4 py-2.5 rounded-lg text-slate-300 hover:text-white font-mono text-xs transition-all flex items-center border border-white/10 hover:border-white/20 bg-white/[0.02]"
                        >
                          <DownloadIcon />
                          <span>Curriculum Vitae</span>
                        </a>
                      )}
                    </div>

                    {/* Social Channels (Verified) */}
                    {portfolio.social_links && portfolio.social_links.length > 0 && (
                      <div className="mt-8 flex flex-wrap items-center gap-2.5 justify-center sm:justify-start">
                        {portfolio.social_links.map((link) => (
                          <a 
                            key={link.platform} 
                            href={link.url} 
                            target="_blank" 
                            rel="noreferrer" 
                            className="px-3 py-1.5 rounded-md bg-dark-surface/60 hover:bg-stone-900 border border-white/5 hover:border-brand-500/30 text-xs text-slate-300 font-mono transition flex items-center"
                          >
                            <span>{link.platform}</span>
                            <ExternalLinkIcon />
                          </a>
                        ))}
                        <button
                          onClick={handleCopyEmail}
                          className="px-3 py-1.5 rounded-md bg-dark-surface/60 hover:bg-stone-900 border border-white/5 hover:border-brand-500/30 text-xs text-brand-300 font-mono transition flex items-center"
                        >
                          {copiedEmail ? <CheckIcon /> : <CopyIcon />}
                          <span>{copiedEmail ? "Copied Email!" : "Copy Email"}</span>
                        </button>
                      </div>
                    )}
                  </div>

                  {/* Architecture Monogram Badge */}
                  <div className="relative">
                    <div className="w-48 h-48 sm:w-56 sm:h-56 rounded-2xl glass-card corner-mark p-1 flex flex-col items-center justify-center text-center shadow-2xl relative overflow-hidden group">
                      <div className="absolute inset-0 bg-gradient-to-tr from-brand-600/25 via-orange-500/10 to-transparent opacity-70 group-hover:opacity-100 transition-opacity"></div>
                      <div className="text-6xl font-black text-brand-400 select-none tracking-tighter relative z-10">
                        YK
                      </div>
                      <div className="text-[10px] font-mono text-slate-400 mt-2 relative z-10 uppercase tracking-widest">
                        Product & Backend Core
                      </div>
                    </div>
                  </div>
                </section>

                {/* Tech Stack Ticker / Infinite Marquee */}
                <div className="my-10 hairline-t hairline-b py-3.5 overflow-hidden relative">
                  <div className="flex items-center space-x-6 text-xs font-mono tracking-wider animate-marquee whitespace-nowrap">
                    {tickerTechs.concat(tickerTechs).map((tech, idx) => (
                      <div key={idx} className="flex items-center space-x-3 text-slate-400 hover:text-brand-300 transition-colors">
                        <span className="w-1.5 h-1.5 rounded-full bg-brand-500/60"></span>
                        <span className="uppercase">{tech}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Narrative Sections (About & Philosophy) */}
                {portfolio.sections && portfolio.sections.length > 0 && (
                  <section id="about" className="py-12">
                    <div className="flex items-center space-x-3 mb-6">
                      <span className="text-xs font-mono text-brand-400">01 //</span>
                      <h2 className="text-2xl sm:text-4xl font-serif font-medium text-white tracking-tight">About</h2>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {portfolio.sections.map((sec) => (
                        <div key={sec.slug} className="glass-card rounded-2xl p-6 sm:p-8 corner-mark">
                          <h3 className="text-xl sm:text-2xl font-serif font-medium text-white mb-3 flex items-center">
                            <span className="w-2 h-2 rounded-sm bg-brand-500 mr-2.5"></span>
                            {sec.title}
                          </h3>
                          <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-line font-sans">
                            {sec.content}
                          </p>
                        </div>
                      ))}
                    </div>
                  </section>
                )}

                {/* Projects Section */}
                <section id="projects" className="py-14 hairline-t">
                  <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8">
                    <div>
                      <div className="flex items-center space-x-3 mb-2">
                        <span className="text-xs font-mono text-brand-400">02 //</span>
                        <h2 className="text-2xl sm:text-4xl font-serif font-medium text-white tracking-tight">Projects</h2>
                      </div>
                      <p className="text-slate-400 text-sm font-sans">Engineered products, structured backend systems, and clean API implementations.</p>
                    </div>

                    {/* Search and Category Filter Controls */}
                    <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
                      {/* Search Bar */}
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <SearchIcon />
                        </div>
                        <input
                          type="text"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          placeholder="Filter by tech or keyword..."
                          className="w-full sm:w-56 pl-9 pr-3 py-1.5 rounded-lg bg-dark-surface/80 border border-white/10 text-xs text-white placeholder-slate-400 focus:outline-none focus:border-brand-500 font-mono"
                        />
                        {searchQuery && (
                          <button
                            onClick={() => setSearchQuery("")}
                            className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-white text-xs"
                          >
                            ×
                          </button>
                        )}
                      </div>

                      {/* Filter Tabs */}
                      <div className="inline-flex rounded-lg bg-dark-surface/90 p-1 border border-white/10 font-mono text-xs">
                        <button 
                          onClick={() => setActiveCategory("all")}
                          className={`px-3 py-1 rounded-md transition ${activeCategory === 'all' ? 'bg-brand-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                        >
                          All ({portfolio.projects.length})
                        </button>
                        <button 
                          onClick={() => setActiveCategory("featured")}
                          className={`px-3 py-1 rounded-md transition ${activeCategory === 'featured' ? 'bg-brand-600 text-white shadow' : 'text-slate-400 hover:text-white'}`}
                        >
                          Featured
                        </button>
                      </div>
                    </div>
                  </div>

                  {/* Projects Grid */}
                  {filteredProjects.length === 0 ? (
                    <div className="glass-card rounded-2xl p-12 text-center my-6">
                      <p className="text-slate-400 font-mono text-sm">No systems matching filter "{searchQuery}".</p>
                      <button
                        onClick={() => { setActiveCategory("all"); setSearchQuery(""); }}
                        className="mt-3 px-3 py-1.5 rounded-md text-xs font-mono text-brand-300 bg-brand-500/10 border border-brand-500/20"
                      >
                        Reset filters
                      </button>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {filteredProjects.map((project) => (
                        <div 
                          key={project.slug} 
                          onClick={() => setSelectedProject(project)}
                          className="glass-card rounded-2xl overflow-hidden flex flex-col justify-between transition group hover:-translate-y-1 cursor-pointer"
                        >
                          {project.media && project.media.length > 0 && (
                            <div className="h-44 w-full overflow-hidden bg-stone-950 border-b border-white/5 relative">
                              <img 
                                src={project.media[0].url} 
                                alt={project.media[0].alt_text || project.title} 
                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-80"
                              />
                              {project.is_featured && (
                                <span className="absolute top-3 right-3 px-2.5 py-0.5 rounded bg-brand-600/90 backdrop-blur-sm text-[10px] font-mono font-semibold text-white uppercase tracking-wider">
                                  Featured System
                                </span>
                              )}
                            </div>
                          )}

                          <div className="p-6 flex-grow flex flex-col justify-between">
                            <div>
                              <div className="flex items-center justify-between mb-2">
                                <h3 className="text-xl sm:text-2xl font-serif font-medium text-white group-hover:text-brand-400 transition-colors flex items-center">
                                  <span>{project.title}</span>
                                  <ArrowUpRight />
                                </h3>
                              </div>
                              <p className="text-slate-300 text-sm leading-relaxed mb-5">
                                {project.description}
                              </p>
                            </div>

                            <div>
                              {/* Technology Pills */}
                              {project.technologies && project.technologies.length > 0 && (
                                <div className="flex flex-wrap gap-1.5 mb-5">
                                  {project.technologies.map((t) => (
                                    <span key={t.slug} className="px-2 py-0.5 rounded text-[10px] font-mono bg-dark-bg/80 text-brand-300 border border-brand-500/20">
                                      {t.name}
                                    </span>
                                  ))}
                                </div>
                              )}

                              {/* Verified Action Links */}
                              <div className="flex items-center space-x-3 pt-4 hairline-t">
                                {project.github_url ? (
                                  <a 
                                    href={project.github_url} 
                                    target="_blank" 
                                    rel="noreferrer" 
                                    onClick={(e) => e.stopPropagation()}
                                    className="text-xs font-mono text-slate-300 hover:text-white flex items-center transition"
                                  >
                                    <GitHubIcon />
                                    <span>Source Repository</span>
                                  </a>
                                ) : (
                                  <span className="text-[11px] font-mono text-slate-500">Proprietary Architecture</span>
                                )}

                                {project.live_url ? (
                                  <a 
                                    href={project.live_url} 
                                    target="_blank" 
                                    rel="noreferrer" 
                                    onClick={(e) => e.stopPropagation()}
                                    className="text-xs font-mono text-brand-400 hover:text-brand-300 flex items-center transition"
                                  >
                                    <span>API Documentation</span>
                                    <ExternalLinkIcon />
                                  </a>
                                ) : (
                                  <span className="text-[11px] font-mono text-slate-500 bg-white/5 px-2 py-0.5 rounded">
                                    Backend Service
                                  </span>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                {/* Project Architecture Detail Modal */}
                {selectedProject && (
                  <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
                    <div 
                      className="glass-card rounded-2xl max-w-2xl w-full p-6 sm:p-8 hairline-border relative max-h-[90vh] overflow-y-auto"
                      onClick={(e) => e.stopPropagation()}
                    >
                      <button 
                        onClick={() => setSelectedProject(null)}
                        className="absolute top-5 right-5 p-1.5 rounded-lg text-slate-400 hover:text-white bg-white/5 hover:bg-white/10 transition"
                      >
                        <CloseIcon />
                      </button>

                      <div className="inline-flex items-center space-x-2 px-2.5 py-1 rounded text-[11px] font-mono bg-brand-500/10 text-brand-300 border border-brand-500/20 mb-3">
                        <span>SYSTEM SPECIFICATION</span>
                        {selectedProject.is_featured && <span>• FEATURED</span>}
                      </div>

                      <h3 className="text-2xl sm:text-3xl font-serif font-medium text-white mb-2">{selectedProject.title}</h3>
                      <p className="text-slate-300 text-sm leading-relaxed mb-6">{selectedProject.description}</p>

                      {/* Modal Media */}
                      {selectedProject.media && selectedProject.media.length > 0 && (
                        <div className="rounded-xl overflow-hidden mb-6 hairline-border bg-stone-950">
                          <img 
                            src={selectedProject.media[0].url} 
                            alt={selectedProject.media[0].alt_text || selectedProject.title}
                            className="w-full h-56 object-cover"
                          />
                          {selectedProject.media[0].caption && (
                            <div className="p-2.5 text-center text-xs font-mono text-slate-400 hairline-t bg-dark-surface/60">
                              {selectedProject.media[0].caption}
                            </div>
                          )}
                        </div>
                      )}

                      {/* Technologies Breakdown */}
                      <div className="mb-6">
                        <div className="text-xs font-mono uppercase text-slate-400 mb-2">Architectural Dependencies:</div>
                        <div className="flex flex-wrap gap-2">
                          {selectedProject.technologies && selectedProject.technologies.map((t) => (
                            <span key={t.slug} className="px-2.5 py-1 rounded text-xs font-mono bg-dark-bg text-brand-300 border border-brand-500/20">
                              {t.name}
                            </span>
                          ))}
                        </div>
                      </div>

                      {/* Action Links */}
                      <div className="flex items-center justify-between pt-4 hairline-t">
                        <div className="flex items-center space-x-4">
                          {selectedProject.github_url && (
                            <a 
                              href={selectedProject.github_url}
                              target="_blank"
                              rel="noreferrer"
                              className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium text-xs font-mono flex items-center transition"
                            >
                              <GitHubIcon />
                              <span>View Source Code</span>
                            </a>
                          )}
                          {selectedProject.live_url && (
                            <a 
                              href={selectedProject.live_url}
                              target="_blank"
                              rel="noreferrer"
                              className="px-4 py-2 rounded-lg glass-card text-brand-300 hover:text-white font-mono text-xs flex items-center transition"
                            >
                              <span>Swagger API Docs</span>
                              <ExternalLinkIcon />
                            </a>
                          )}
                        </div>

                        <button 
                          onClick={() => setSelectedProject(null)}
                          className="text-xs font-mono text-slate-400 hover:text-white"
                        >
                          Close [ESC]
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* 03 // STACK */}
                {portfolio.skills && portfolio.skills.length > 0 && (
                  <section id="stack" className="py-14 hairline-t">
                    <div className="flex items-center space-x-3 mb-2">
                      <span className="text-xs font-mono text-brand-400">03 //</span>
                      <h2 className="text-2xl sm:text-4xl font-serif font-medium text-white tracking-tight">Stack</h2>
                    </div>
                    <p className="text-slate-400 text-sm mb-8 font-sans">Technologies I have genuinely worked with across backend services, data modeling, and testing.</p>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                      {portfolio.skills.map((skill) => (
                        <div key={skill.slug} className="glass-card rounded-xl p-4 flex flex-col justify-between hover:border-brand-500/40 transition">
                          <div>
                            <span className="text-[10px] font-mono uppercase tracking-wider text-brand-400 font-semibold">
                              {skill.category || 'Technology'}
                            </span>
                            <div className="text-base font-semibold text-white mt-1 font-sans">
                              {skill.name}
                            </div>
                          </div>
                          <div className="mt-3 flex items-center space-x-1.5 text-[11px] font-mono text-slate-400">
                            <span className="w-1.5 h-1.5 rounded-full bg-brand-500/60"></span>
                            <span>Verified</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>
                )}

                {/* 04 // JOURNEY */}
                {portfolio.experience && portfolio.experience.length > 0 && (
                  <section id="journey" className="py-14 hairline-t">
                    <div className="flex items-center space-x-3 mb-2">
                      <span className="text-xs font-mono text-brand-400">04 //</span>
                      <h2 className="text-2xl sm:text-4xl font-serif font-medium text-white tracking-tight">Journey</h2>
                    </div>
                    <p className="text-slate-400 text-sm mb-8 font-sans">My focus on building purposeful software, designing maintainable backend architectures, and practical engineering.</p>

                    <div className="space-y-6">
                      {portfolio.experience.map((exp) => (
                        <div key={exp.company + exp.role} className="glass-card rounded-2xl p-6 sm:p-8 corner-mark">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                            <div>
                              <h3 className="text-xl sm:text-2xl font-serif font-medium text-white">{exp.role}</h3>
                              <div className="text-sm font-medium text-brand-400 font-mono mt-0.5">
                                {exp.company} • <span className="text-slate-400">{exp.location}</span>
                              </div>
                            </div>
                            <div className="px-3 py-1 rounded-full text-xs font-mono bg-white/5 text-slate-300 self-start sm:self-auto border border-white/5">
                              Active Focus
                            </div>
                          </div>
                          <p className="text-slate-300 text-sm leading-relaxed whitespace-pre-line mt-4 font-sans">
                            {exp.description}
                          </p>
                        </div>
                      ))}
                    </div>
                  </section>
                )}

                {/* 05 // CONTACT */}
                <section id="contact" className="py-16 hairline-t">
                  <div className="flex items-center space-x-3 mb-2">
                    <span className="text-xs font-mono text-brand-400">05 //</span>
                    <h2 className="text-2xl sm:text-4xl font-serif font-medium text-white tracking-tight">Contact</h2>
                  </div>
                  <h3 className="text-2xl sm:text-4xl font-serif font-medium text-white mb-2 leading-tight">Let's build something useful.</h3>
                  <p className="text-slate-400 text-sm mb-8 max-w-2xl leading-relaxed font-sans">
                    I'm interested in building digital products, solving practical engineering problems, collaborating with other developers, and continuing to grow through real-world projects.
                  </p>

                  <div className="grid grid-cols-1 md:grid-cols-5 gap-8">
                    {/* Contact Details & Availability */}
                    <div className="md:col-span-2 space-y-6">
                      <div className="glass-card rounded-2xl p-6 corner-mark">
                        <div className="inline-flex items-center space-x-2 px-2.5 py-1 rounded text-xs font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-4">
                          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                          <span>Open for Collaboration & Projects</span>
                        </div>
                        <h4 className="text-lg sm:text-xl font-serif font-medium text-white mb-2">Direct Contact Channels</h4>
                        <p className="text-slate-300 text-sm leading-relaxed mb-6">
                          Reach out directly for technical collaboration, software discussions, or product engineering inquiries.
                        </p>

                        <div className="space-y-3 font-mono text-xs">
                          <div>
                            <span className="text-slate-500 block">DIRECT EMAIL</span>
                            <div className="flex items-center justify-between mt-1">
                              <a href="mailto:khalidzak21@gmail.com" className="text-brand-300 hover:underline">
                                khalidzak21@gmail.com
                              </a>
                              <button 
                                onClick={handleCopyEmail}
                                className="px-2 py-0.5 rounded text-[10px] bg-white/5 border border-white/10 hover:bg-white/10 text-slate-300"
                              >
                                {copiedEmail ? "Copied!" : "Copy"}
                              </button>
                            </div>
                          </div>

                          <div className="pt-2 hairline-t">
                            <span className="text-slate-500 block">GITHUB</span>
                            <a 
                              href="https://github.com/Khaliddray" 
                              target="_blank" 
                              rel="noreferrer"
                              className="text-slate-300 hover:text-white flex items-center gap-1 mt-1"
                            >
                              <span>github.com/Khaliddray</span>
                              <ExternalLinkIcon />
                            </a>
                          </div>

                          <div className="pt-2 hairline-t">
                            <span className="text-slate-500 block">LOCATION</span>
                            <span className="text-slate-300">Abuja, Nigeria (Open to Remote)</span>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* Interactive Form */}
                    <div className="md:col-span-3">
                      <form onSubmit={handleContactSubmit} className="glass-card rounded-2xl p-6 sm:p-8 space-y-4">
                        {contactStatus && (
                          <div className={`p-4 rounded-xl text-xs font-mono ${contactStatus.type === 'success' ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20' : 'bg-brand-500/10 text-brand-300 border border-brand-500/20'}`}>
                            {contactStatus.message}
                          </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-mono text-slate-400 mb-1.5">YOUR NAME</label>
                            <input 
                              type="text"
                              required
                              value={contactForm.name}
                              onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                              placeholder="e.g. Alex Smith"
                              className="w-full px-3.5 py-2.5 rounded-lg bg-dark-bg/80 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 font-sans"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-mono text-slate-400 mb-1.5">EMAIL ADDRESS</label>
                            <input 
                              type="email"
                              required
                              value={contactForm.email}
                              onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                              placeholder="alex@company.com"
                              className="w-full px-3.5 py-2.5 rounded-lg bg-dark-bg/80 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 font-sans"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-mono text-slate-400 mb-1.5">SUBJECT / TOPIC</label>
                          <input 
                            type="text"
                            required
                            value={contactForm.subject}
                            onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                            placeholder="Engineering Role / Architecture Discussion"
                            className="w-full px-3.5 py-2.5 rounded-lg bg-dark-bg/80 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 font-sans"
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-mono text-slate-400 mb-1.5">MESSAGE</label>
                          <textarea 
                            rows="4"
                            required
                            value={contactForm.message}
                            onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                            placeholder="Details about your engineering project, role requirements, or collaboration..."
                            className="w-full px-3.5 py-2.5 rounded-lg bg-dark-bg/80 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 font-sans"
                          ></textarea>
                        </div>

                        <button 
                          type="submit"
                          disabled={contactSubmitting}
                          className="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 disabled:opacity-50 text-white font-medium text-xs font-mono transition shadow-lg shadow-brand-600/20"
                        >
                          {contactSubmitting ? "DISPATCHING INQUIRY..." : "TRANSMIT MESSAGE →"}
                        </button>
                      </form>
                    </div>
                  </div>
                </section>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="hairline-t py-8 bg-dark-bg/90 relative z-10">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-4">
              <div className="font-mono text-[11px]">
                © 2026 Yahaya Khalid · Built with a focus on practical software and continuous improvement
              </div>
              <div className="flex items-center space-x-6 font-mono text-[11px]">
                <a href={`/api/public/portfolios/${slug}`} target="_blank" className="hover:text-brand-400 transition">JSON API Payload</a>
                <a href="/docs" target="_blank" className="hover:text-brand-400 transition">Swagger UI</a>
                <a href="/health" target="_blank" className="hover:text-brand-400 transition">Health Status</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
