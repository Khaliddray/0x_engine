<head>

  <!-- Tailwind CSS -->

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <style>
    body {
      font-family: "Inter", "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .dark body {
      background-color: #080809;
      background-image: radial-gradient(circle at 60% 0%, #1c0c04 0%, #0d0806 35%, #080809 75%);
      background-attachment: fixed;
      color: #f5f5f5;
    }

    body:not(.dark-mode):not(.dark) {
      background-color: #f8fafc;
      background-image: radial-gradient(circle at 60% 0%, #fff1eb 0%, #fdf6f0 35%, #f8fafc 75%);
      background-attachment: fixed;
      color: #1e293b;
    }

    .editorial-heading {
      font-family: "Playfair Display", Georgia, Cambria, serif;
      letter-spacing: -0.015em;
    }

    /* Ambient Radial Glows */
    .glow-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      transform: translateZ(0);
    }
    .radial-glow-hero {
      position: absolute;
      top: -150px;
      right: 10%;
      width: 900px;
      height: 700px;
      background: radial-gradient(ellipse 70% 55% at 50% 30%, rgba(249, 115, 22, 0.12) 0%, rgba(245, 106, 106, 0.04) 50%, transparent 75%);
    }
    .radial-glow-bottom {
      position: absolute;
      bottom: 5%;
      left: 15%;
      width: 750px;
      height: 750px;
      background: radial-gradient(circle 450px at center, rgba(234, 88, 12, 0.08) 0%, rgba(245, 106, 106, 0.02) 50%, transparent 70%);
    }

    /* Tactile Grain Noise Overlay */
    .tactile-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
      opacity: 0.022;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Structural Framing & Cards */
    .dark .glass-card {
      background: rgba(18, 18, 21, 0.82);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(249, 115, 22, 0.12);
    }
    .dark .glass-card:hover {
      border-color: rgba(249, 115, 22, 0.38);
      box-shadow: 0 10px 30px -10px rgba(249, 115, 22, 0.12);
    }
    
    body:not(.dark) .glass-card {
      background: #ffffff;
      border: 1px solid rgba(210, 215, 217, 0.85);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    body:not(.dark) .glass-card:hover {
      border-color: #f56a6a;
      box-shadow: 0 10px 25px -8px rgba(245, 106, 106, 0.15);
    }

    .dark .hairline-border {
      border: 1px solid rgba(249, 115, 22, 0.12);
    }
    .dark .hairline-b {
      border-bottom: 1px solid rgba(249, 115, 22, 0.12);
    }
    .dark .hairline-t {
      border-top: 1px solid rgba(249, 115, 22, 0.12);
    }
    .dark .hairline-r {
      border-right: 1px solid rgba(249, 115, 22, 0.12);
    }

    body:not(.dark) .hairline-border {
      border: 1px solid rgba(210, 215, 217, 0.85);
    }
    body:not(.dark) .hairline-b {
      border-bottom: 1px solid rgba(210, 215, 217, 0.85);
    }
    body:not(.dark) .hairline-t {
      border-top: 1px solid rgba(210, 215, 217, 0.85);
    }
    body:not(.dark) .hairline-r {
      border-right: 1px solid rgba(210, 215, 217, 0.85);
    }

    /* Corner Accent Marks */
    .corner-mark {
      position: relative;
    }
    .corner-mark::before {
      content: '+';
      position: absolute;
      top: -9px;
      left: -6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #f56a6a;
      pointer-events: none;
    }
    .corner-mark::after {
      content: '+';
      position: absolute;
      bottom: -9px;
      right: -6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #f56a6a;
      pointer-events: none;
    }

    /* Marquee animation */
    @keyframes marquee {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .animate-marquee {
      display: flex;
      width: 200%;
      animation: marquee 28s linear infinite;
    }
    .animate-marquee:hover {
      animation-play-state: paused;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 3px;
    }
    body:not(.dark) ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>

    const SearchIcon = () => (

    const SunIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    );

    const MoonIcon = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    );

    const MailIcon = () => (
      <svg className="w-4 h-4 inline-block mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
      </svg>
    );

    const MapPinIcon = () => (
      <svg className="w-4 h-4 inline-block mr-2 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>

    const ArrowUpRight = () => (
      <svg className="w-4 h-4 ml-1 transform group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 17L17 7M17 7H7M17 7V17"/>
      </svg>
    );

    // --- Main Application Component ---
    function App() {
      const getInitialSlug = () => {
        try {
          const path = window.location.pathname;
          const match = path.match(/^\/portfolio\/([^/]+)/);
          if (match && match[1]) {
            return decodeURIComponent(match[1]);
          }
        } catch (e) {}
        return "khalid";
      };

      const [slug, setSlug] = useState(getInitialSlug);
      const [portfolio, setPortfolio] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      // Theme toggle (Dark / Light)
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('theme');
        return saved ? saved === 'dark' : true;
      });

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }, [isDark]);

      // Filtering and Search State
      const [activeCategory, setActiveCategory] = useState("all");
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedProject, setSelectedProject] = useState(null);

      // Feedback states
      const [copiedEmail, setCopiedEmail] = useState(false);
      const [copiedCurl, setCopiedCurl] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(false);

      // Contact Form State
      const [contactForm, setContactForm] = useState({
        name: "",
        email: "",
        subject: "",
        message: "",
      });
      const [contactSubmitting, setContactSubmitting] = useState(false);
      const [contactStatus, setContactStatus] = useState(null);

      useEffect(() => {
        fetchPortfolio(slug);
      }, [slug]);

      const fetchPortfolio = async (targetSlug) => {
        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`/api/public/portfolios/${targetSlug}`);
          if (!res.ok) {
            if (res.status === 404) {
              throw new Error(`Portfolio with slug "${targetSlug}" was not found.`);
            }
            throw new Error(`Failed to load portfolio (HTTP ${res.status})`);
          }
          const data = await res.json();
          setPortfolio(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const handleCopyEmail = (e) => {
        if (e) e.preventDefault();
        navigator.clipboard.writeText("khalidzak21@gmail.com");
        setCopiedEmail(true);
        setTimeout(() => setCopiedEmail(false), 2500);
      };

      const handleCopyCurl = (e) => {
        if (e) e.preventDefault();
        const curlCmd = `curl -s ${window.location.origin}/api/public/portfolios/${slug}`;
        navigator.clipboard.writeText(curlCmd);
        setCopiedCurl(true);
        setTimeout(() => setCopiedCurl(false), 2500);
      };

      const handleContactSubmit = async (e) => {
        e.preventDefault();
        setContactSubmitting(true);
        setContactStatus(null);

        try {
          const res = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(contactForm),
          });

          if (!res.ok) {
            throw new Error(`Inquiry submission failed (HTTP ${res.status})`);
          }

          const data = await res.json();
          setContactStatus({
            type: "success",
            message: data.message || "Your inquiry has been received! Yahaya Khalid will follow up shortly.",
          });
          setContactForm({ name: "", email: "", subject: "", message: "" });
        } catch (err) {
          // Fallback to mailto
          window.location.href = `mailto:khalidzak21@gmail.com?subject=${encodeURIComponent(contactForm.subject || "Engineering Inquiry")}&body=${encodeURIComponent(`From: ${contactForm.name} (${contactForm.email})\n\n${contactForm.message}`)}`;
          setContactStatus({
            type: "info",
            message: "Opened your default email client to send your message directly.",
          });
        } finally {
          setContactSubmitting(false);
        }
      };

      // Filtered projects
      const filteredProjects = useMemo(() => {
        if (!portfolio || !portfolio.projects) return [];

        return portfolio.projects.filter((p) => {
          if (activeCategory === "featured" && !p.is_featured) return false;

          if (searchQuery.trim() !== "") {
            const query = searchQuery.toLowerCase();
            const titleMatch = p.title.toLowerCase().includes(query);
            const descMatch = (p.description || "").toLowerCase().includes(query);
            const techMatch = (p.technologies || []).some(t => t.name.toLowerCase().includes(query));
            if (!titleMatch && !descMatch && !techMatch) return false;
          }

          return true;
        });
      }, [portfolio, activeCategory, searchQuery]);

      // Filtered skills
      const filteredSkills = useMemo(() => {
        if (!portfolio || !portfolio.skills) return [];
        if (searchQuery.trim() === "") return portfolio.skills;

        const query = searchQuery.toLowerCase();
        return portfolio.skills.filter(s => 
          s.name.toLowerCase().includes(query) || 
          (s.category && s.category.toLowerCase().includes(query))
        );
      }, [portfolio, searchQuery]);

      // Verified architecture ticker technologies
      const tickerTechs = [
        "Python", "FastAPI", "PostgreSQL", "SQLAlchemy", "Alembic", 
        "Pydantic", "REST APIs", "Pytest", "Docker", "Git & GitHub"
      ];

      // Navigation handler with smooth scroll and drawer close
      const handleNavClick = (id) => {
        setSidebarOpen(false);
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      };

      // --- Persistent Sidebar Content Component ---
      const SidebarContent = () => (
        <div className="flex flex-col h-full justify-between p-6 sm:p-8 text-sm">
          <div className="space-y-8">
            {/* Sidebar Brand Header */}
            <div>
              <div className="flex items-center space-x-3 mb-2">
                <div className="w-9 h-9 rounded-lg bg-gradient-to-tr from-brand-600 via-orange-500 to-amber-400 flex items-center justify-center font-bold text-xs font-mono text-black shadow-md">
                  YK
                </div>
                <div>
                  <h2 className="font-serif font-bold text-base dark:text-white text-slate-900 leading-tight">Yahaya Khalid</h2>
                  <p className="text-[11px] font-mono dark:text-slate-400 text-slate-500">Product Builder & Backend Engineer</p>
                </div>
              </div>
            </div>

            {/* Sidebar Search Bar */}
            <div className="relative">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <SearchIcon />
              </div>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search projects & stack..."
                className="w-full pl-9 pr-3 py-2 rounded-lg text-xs font-mono dark:bg-dark-card dark:text-white text-slate-800 dark:border-white/10 border-slate-300 border focus:outline-none focus:border-brand-500 dark:placeholder-slate-500 placeholder-slate-400 transition"
              />
              {searchQuery && (
                <button
                  onClick={() => setSearchQuery("")}
                  className="absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-200 text-xs"
                >
                  ×
                </button>
              )}
            </div>

            {/* Navigation Menu (Reference Structure) */}
            <nav className="space-y-1 font-mono text-xs">
              <div className="text-[10px] uppercase font-bold tracking-widest dark:text-slate-500 text-slate-400 mb-2">
                // Navigation Menu
              </div>
              <button 
                onClick={() => handleNavClick("about")} 
                className="w-full text-left py-2 px-3 rounded-lg dark:hover:bg-white/5 hover:bg-slate-200/70 transition flex items-center justify-between dark:text-slate-300 text-slate-700 hover:text-brand-500"
              >
                <span>01 // ABOUT</span>
                <span className="text-[10px] text-slate-500">→</span>
              </button>
              <button 
                onClick={() => handleNavClick("projects")} 
                className="w-full text-left py-2 px-3 rounded-lg dark:hover:bg-white/5 hover:bg-slate-200/70 transition flex items-center justify-between dark:text-slate-300 text-slate-700 hover:text-brand-500"
              >
                <span>02 // PROJECTS</span>
                <span className="text-[10px] text-slate-500">→</span>
              </button>
              <button 
                onClick={() => handleNavClick("stack")} 
                className="w-full text-left py-2 px-3 rounded-lg dark:hover:bg-white/5 hover:bg-slate-200/70 transition flex items-center justify-between dark:text-slate-300 text-slate-700 hover:text-brand-500"
              >
                <span>03 // STACK</span>
                <span className="text-[10px] text-slate-500">→</span>
              </button>

                            {selectedProject.technologies && selectedProject.technologies.map((t) => (

                                {t.name}
                              </span>
                            ))}
                          </div>
                        </div>

                        {/* Action Links */}
                        <div className="flex items-center justify-between pt-4 hairline-t">
                          <div className="flex items-center space-x-4">
                            {selectedProject.github_url && (
                              <a 
                                href={selectedProject.github_url}
                                target="_blank"
                                rel="noreferrer"
                                className="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium text-xs font-mono flex items-center transition"
                              >
                                <GitHubIcon />
                                <span>View Source Code</span>
                              </a>
                            )}
                            {selectedProject.live_url && (
                              <a 
                                href={selectedProject.live_url}
                                target="_blank"
                                rel="noreferrer"
                                className="px-4 py-2 rounded-lg glass-card text-brand-600 dark:text-brand-300 font-mono text-xs flex items-center transition"
                              >
                                <span>Swagger API Docs</span>
                                <ExternalLinkIcon />
                              </a>
                            )}
                          </div>

                          <button 
                            onClick={() => setSelectedProject(null)}
                            className="text-xs font-mono text-slate-400 hover:text-slate-200"
                          >
                            Close [ESC]
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* 03 // TOOLS OF MY CRAFT / STACK */}
                  <section id="stack" className="space-y-6 hairline-t pt-10">
                    <div className="flex items-center space-x-3 mb-1">
                      <span className="text-xs font-mono text-brand-600 dark:text-brand-400 font-bold">03 //</span>
                      <h2 className="text-2xl sm:text-3xl font-serif font-medium dark:text-white text-slate-900 tracking-tight">Tools of My Craft</h2>
                    </div>
                    <p className="dark:text-slate-400 text-slate-600 text-sm">
                      Technologies verified across backend services, data modeling, automated testing, and containerization.
                    </p>

                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3.5">
                      {filteredSkills.map((skill) => (
                        <div key={skill.slug} className="glass-card rounded-xl p-4 flex flex-col justify-between hover:border-brand-500/50 transition">
                          <div>
                            <span className="text-[10px] font-mono uppercase tracking-wider text-brand-600 dark:text-brand-400 font-semibold">
                              {skill.category || 'Technology'}
                            </span>
                            <div className="text-sm font-semibold dark:text-white text-slate-900 mt-1 font-sans">
                              {skill.name}
                            </div>
                          </div>
                          <div className="mt-3 flex items-center space-x-1.5 text-[10px] font-mono dark:text-slate-400 text-slate-500">
                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                            <span>Verified</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </section>

                  {/* 04 // JOURNEY & FOUNDATIONS */}
                  {portfolio.experience && portfolio.experience.length > 0 && (
                    <section id="journey" className="space-y-6 hairline-t pt-10">
                      <div className="flex items-center space-x-3 mb-1">
                        <span className="text-xs font-mono text-brand-600 dark:text-brand-400 font-bold">04 //</span>
                        <h2 className="text-2xl sm:text-3xl font-serif font-medium dark:text-white text-slate-900 tracking-tight">Journey &amp; Foundations</h2>
                      </div>
                      <p className="dark:text-slate-400 text-slate-600 text-sm">
                        Hands-on groundwork in building purposeful digital products, designing maintainable backend systems, and turning ideas into working software.
                      </p>

                      <div className="space-y-6">
                        {portfolio.experience.map((exp) => (
                          <div key={exp.company + exp.role} className="glass-card rounded-2xl p-6 sm:p-8 corner-mark">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                              <div>
                                <h3 className="text-xl font-serif font-medium dark:text-white text-slate-900">{exp.role}</h3>
                                <div className="text-sm font-medium text-brand-600 dark:text-brand-400 font-mono mt-0.5">
                                  {exp.company} • <span className="dark:text-slate-400 text-slate-500">{exp.location}</span>
                                </div>
                              </div>
                              <div className="px-3 py-1 rounded-full text-xs font-mono dark:bg-white/5 bg-slate-200/80 dark:text-slate-300 text-slate-700 self-start sm:self-auto border dark:border-white/5 border-slate-300">
                                Active Focus
                              </div>
                            </div>
                            <p className="dark:text-slate-300 text-slate-600 text-sm leading-relaxed whitespace-pre-line mt-4 font-sans">
                              {exp.description}
                            </p>
                          </div>
                        ))}
                      </div>
                    </section>
                  )}

                  {/* 05 // CONTACT SECTION */}
                  <section id="contact" className="space-y-6 hairline-t pt-10 pb-12">
                    <div className="flex items-center space-x-3 mb-1">
                      <span className="text-xs font-mono text-brand-600 dark:text-brand-400 font-bold">05 //</span>
                      <h2 className="text-2xl sm:text-3xl font-serif font-medium dark:text-white text-slate-900 tracking-tight">Contact</h2>
                    </div>

                    <header className="max-w-2xl">
                      <h3 className="text-2xl sm:text-4xl font-serif font-medium dark:text-white text-slate-900 mb-2 leading-tight">
                        Let's build something useful.
                      </h3>
                      <p className="dark:text-slate-300 text-slate-600 text-sm leading-relaxed">
                        I'm interested in building digital products, solving practical engineering problems, collaborating with other developers, and continuing to grow through real-world projects.
                      </p>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-5 gap-8 pt-2">
                      {/* Left: Contact Info Card */}
                      <div className="md:col-span-2 space-y-6">
                        <div className="glass-card rounded-2xl p-6 corner-mark">
                          <div className="inline-flex items-center space-x-2 px-2.5 py-1 rounded text-xs font-mono bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 mb-4">
                            <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                            <span>Open for Collaboration</span>
                          </div>
                          <h4 className="text-lg font-serif font-medium dark:text-white text-slate-900 mb-2">Direct Inquiries</h4>
                          <p className="dark:text-slate-300 text-slate-600 text-sm leading-relaxed mb-6">
                            Reach out directly for technical collaboration, backend engineering discussions, or software opportunities.
                          </p>

                          <div className="space-y-4 font-mono text-xs">
                            <div>
                              <span className="text-slate-400 block text-[10px] uppercase font-semibold">EMAIL</span>
                              <div className="flex items-center justify-between mt-1">
                                <a href="mailto:khalidzak21@gmail.com" className="text-brand-600 dark:text-brand-400 hover:underline">
                                  khalidzak21@gmail.com
                                </a>
                                <button 
                                  onClick={handleCopyEmail}
                                  className="px-2 py-0.5 rounded text-[10px] dark:bg-white/5 bg-slate-200 border dark:border-white/10 border-slate-300 text-slate-600 dark:text-slate-300"
                                >
                                  {copiedEmail ? "Copied!" : "Copy"}
                                </button>
                              </div>
                            </div>

                            <div className="pt-2 hairline-t">
                              <span className="text-slate-400 block text-[10px] uppercase font-semibold">GITHUB</span>
                              <a 
                                href="https://github.com/Khaliddray" 
                                target="_blank" 
                                rel="noreferrer"
                                className="dark:text-slate-300 text-slate-700 hover:text-brand-500 flex items-center gap-1 mt-1"
                              >
                                <span>github.com/Khaliddray</span>
                                <ExternalLinkIcon />
                              </a>
                            </div>

                            <div className="pt-2 hairline-t">
                              <span className="text-slate-400 block text-[10px] uppercase font-semibold">LOCATION</span>
                              <span className="dark:text-slate-300 text-slate-700">Abuja, Nigeria (Open to Remote)</span>
                            </div>
                          </div>
                        </div>
                      </div>

                      {/* Right: Interactive Contact Form */}
                      <div className="md:col-span-3">
                        <form onSubmit={handleContactSubmit} className="glass-card rounded-2xl p-6 sm:p-8 space-y-4">
                          {contactStatus && (
                            <div className={`p-4 rounded-xl text-xs font-mono ${contactStatus.type === 'success' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-brand-500/10 text-brand-400 border border-brand-500/20'}`}>
                              {contactStatus.message}
                            </div>
                          )}

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-mono dark:text-slate-400 text-slate-600 mb-1.5">YOUR NAME</label>
                              <input 
                                type="text"
                                required
                                value={contactForm.name}
                                onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                                placeholder="e.g. Alex Smith"
                                className="w-full px-3.5 py-2.5 rounded-lg dark:bg-dark-bg bg-slate-50 border dark:border-white/10 border-slate-300 text-sm dark:text-white text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 font-sans"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-mono dark:text-slate-400 text-slate-600 mb-1.5">EMAIL ADDRESS</label>
                              <input 
                                type="email"
                                required
                                value={contactForm.email}
                                onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                                placeholder="alex@company.com"
                                className="w-full px-3.5 py-2.5 rounded-lg dark:bg-dark-bg bg-slate-50 border dark:border-white/10 border-slate-300 text-sm dark:text-white text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 font-sans"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="block text-xs font-mono dark:text-slate-400 text-slate-600 mb-1.5">SUBJECT / TOPIC</label>
                            <input 
                              type="text"
                              required
                              value={contactForm.subject}
                              onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                              placeholder="Engineering Role / Project Discussion"
                              className="w-full px-3.5 py-2.5 rounded-lg dark:bg-dark-bg bg-slate-50 border dark:border-white/10 border-slate-300 text-sm dark:text-white text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 font-sans"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-mono dark:text-slate-400 text-slate-600 mb-1.5">MESSAGE</label>
                            <textarea 
                              rows="4"
                              required
                              value={contactForm.message}
                              onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                              placeholder="Details about your engineering project, role requirements, or collaboration..."
                              className="w-full px-3.5 py-2.5 rounded-lg dark:bg-dark-bg bg-slate-50 border dark:border-white/10 border-slate-300 text-sm dark:text-white text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 font-sans"
                            ></textarea>
                          </div>

                          <button 
                            type="submit"
                            disabled={contactSubmitting}
                            className="w-full sm:w-auto px-6 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 disabled:opacity-50 text-white font-medium text-xs font-mono transition shadow-md shadow-brand-600/20"
                          >
                            {contactSubmitting ? "DISPATCHING INQUIRY..." : "TRANSMIT MESSAGE →"}
                          </button>
                        </form>
                      </div>
                    </div>
                  </section>
                </div>
              )}
            </main>

            {/* Bottom Footer */}
            <footer className="hairline-t py-8 dark:bg-dark-bg/90 bg-light-bg/90 relative z-10">
              <div className="max-w-5xl mx-auto px-4 sm:px-8 flex flex-col sm:flex-row items-center justify-between text-xs dark:text-slate-400 text-slate-500 gap-4">
                <div className="font-mono text-[11px]">
                  © 2026 Yahaya Khalid · Built with a focus on practical software and continuous improvement
                </div>
                <div className="flex items-center space-x-6 font-mono text-[11px]">
                  <a href={`/api/public/portfolios/${slug}`} target="_blank" className="hover:text-brand-500 transition">JSON API Payload</a>
                  <a href="/docs" target="_blank" className="hover:text-brand-500 transition">Swagger UI</a>
                  <a href="/health" target="_blank" className="hover:text-brand-500 transition">Health Status</a>
                </div>
              </div>
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
