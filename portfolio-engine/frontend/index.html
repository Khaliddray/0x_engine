      content: '+';

      top: -9px;
      left: -6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #f56a6a;

      right: -6px;

      font-size: 11px;
      color: #f56a6a;

    // --- Route Normalization Helper ---
    function resolveRoute(pathname) {
      const cleanPath = pathname.replace(/\/$/, '') || '/';
      if (cleanPath === '/admin') {
        window.location.href = '/admin';
        return 'admin';
      }
      if (cleanPath === '/' || cleanPath.startsWith('/portfolio')) return 'home';
      if (cleanPath === '/about') return 'about';
      if (cleanPath === '/projects') return 'projects';
      if (cleanPath === '/stack') return 'stack';
      if (cleanPath === '/journey') return 'journey';
      if (cleanPath === '/contact') return 'contact';
      return 'not-found';
    }

    // --- Verified Stack Data Definitions ---

    // --- Curated Showcase Products Data Source ---
    const SHOWCASE_PRODUCTS = [
      {
        name: "Portfolio Engine",
        description: "A content-driven portfolio management system and API designed to present professional engineering work, manage evolving showcase content, and decouple domain data from frontend presentation. Built to accommodate career growth without requiring periodic redesigns.",

    // --- Main Application Component ---
    function App() {
      // 1. Navigation State
      const [currentRoute, setCurrentRoute] = useState(() => resolveRoute(window.location.pathname));
      const [menuOpen, setMenuOpen] = useState(false);

      // 2. Data State
      const [portfolio, setPortfolio] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      // 3. Theme Toggle (Dark / Light)
      const [isDark, setIsDark] = useState(() => {
        const saved = localStorage.getItem('theme');
        return saved ? saved === 'dark' : true;
      });

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
          if (document.body) document.body.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          if (document.body) document.body.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      }, [isDark]);

      // 4. Curated Showcase Products State
      const [products, setProducts] = useState(SHOWCASE_PRODUCTS);

      // 5. Contact Form State
      const [contactForm, setContactForm] = useState({
        name: "",
        email: "",
        subject: "",
        message: "",
      });
      const [contactSubmitting, setContactSubmitting] = useState(false);
      const [contactStatus, setContactStatus] = useState(null);
      const [copiedEmail, setCopiedEmail] = useState(false);

      // 6. Router Navigation Function
      const navigateTo = useCallback((path, e) => {
        if (e) e.preventDefault();
        setMenuOpen(false);
        if (window.location.pathname !== path) {
          window.history.pushState({}, '', path);
        }
        setCurrentRoute(resolveRoute(path));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, []);

      // 7. Popstate Listener for Browser Back/Forward
      useEffect(() => {
        const handlePopState = () => {
          setCurrentRoute(resolveRoute(window.location.pathname));
          setMenuOpen(false);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      // 8. Escape Key for Menu
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            if (menuOpen) setMenuOpen(false);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [menuOpen]);

      // 9. Document Title Synchronization
      useEffect(() => {
        const titles = {
          'home': 'Yahaya Khalid — Product Builder & Backend Engineer',
          'about': 'About & Principles — Yahaya Khalid',
          'projects': 'Featured Projects — Yahaya Khalid',
          'stack': 'Tools of My Craft — Yahaya Khalid',
          'journey': 'Journey & Foundations — Yahaya Khalid',
          'contact': 'Contact & Collaboration — Yahaya Khalid',
          'not-found': '404 // Page Not Found — Yahaya Khalid',
        };
        document.title = titles[currentRoute] || 'Yahaya Khalid';
      }, [currentRoute]);

      // 10. Fetch Portfolio Data
      useEffect(() => {
        const fetchPortfolio = async () => {
          setLoading(true);
          setError(null);
          try {
            const res = await fetch('/api/public/portfolios/khalid');
            if (!res.ok) {
              if (res.status === 404) {
                throw new Error('Portfolio record for Yahaya Khalid not found.');
              }
              throw new Error(`Failed to load portfolio (HTTP ${res.status})`);
            }
            const data = await res.json();
            setPortfolio(data);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
