{% extends "base.html" %}

{% block title %}404 // Page Not Found — Yahaya Khalid{% endblock %}

{% block content %}
<div class="py-24 text-center max-w-lg mx-auto space-y-6">
  <div class="w-16 h-16 mx-auto rounded-2xl glass-card flex items-center justify-center text-brand-500 font-mono text-2xl font-bold">
    404
  </div>
  <div>
    <span class="text-xs font-mono text-brand-600 dark:text-brand-400 uppercase tracking-widest font-semibold">
      // Route Not Found
    </span>
    <h1 class="text-3xl font-serif font-medium dark:text-white text-slate-900 mt-2">
      Page Not Found
    </h1>
    <p class="dark:text-slate-400 text-slate-600 text-sm mt-2">
      The page you are looking for does not exist or may have been relocated.
    </p>
  </div>
  <a
    href="/"
    class="inline-block px-6 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-mono text-xs font-semibold transition"

    ← Return to Homepage
  </a>
</div>
{% endblock %}
