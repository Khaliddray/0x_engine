<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Yahaya Khalid — Product Builder &amp; Backend Engineer{% endblock %}</title>
  <meta name="description" content="I build purposeful digital products that turn complex problems into practical, scalable solutions." />

  <!-- Favicon Configuration -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='favicon-32x32.png') }}" />
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', path='favicon-16x16.png') }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', path='apple-touch-icon.png') }}" />

  <!-- Google Fonts: Playfair Display (Serif), Inter (Sans), JetBrains Mono (Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'Cambria', 'serif'],
            sans: ['"Inter"', '"Plus Jakarta Sans"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
              950: '#431407',
            },
            coral: {
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              accent: '#f56a6a',
            },
            dark: {
              bg: '#030E0A',
              sidebar: '#020906',
              surface: '#071A12',
              card: '#0A2118',
              border: '#143528',
              hairline: 'rgba(249, 115, 22, 0.15)',
            },
            light: {
              bg: '#fdfbf7',
              sidebar: '#f8f6f0',
              surface: '#ffffff',
              card: '#ffffff',
              border: '#e6dfd5',
              text: '#1a2320',
              muted: '#5e6f67',
            }
          }
        }
      }
    }
  </script>

  <!-- Global Stylesheets -->
  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/navbar.css') }}" />

  <!-- Page-Specific Stylesheets Block -->
  {% block page_css %}{% endblock %}
</head>
<body class="min-h-screen selection:bg-brand-500 selection:text-black relative">
  <!-- Architectural Background Glows and Tactile Grain -->
  <div class="glow-canvas">
    <div class="radial-glow-hero"></div>
    <div class="radial-glow-bottom"></div>
  </div>
  <div class="tactile-grain"></div>

  <!-- Shared Header Component -->
  {% include "partials/header.html" %}

  <!-- Shared Slide-over Drawer Navigation Panel -->
  {% include "partials/navbar.html" %}

  <!-- Main Page Content Block -->
  <main class="max-w-5xl mx-auto px-4 sm:px-8 py-8 w-full flex-grow relative z-10">
    {% block content %}{% endblock %}
  </main>

  <!-- Shared Footer Component -->
  {% include "partials/footer.html" %}

  <!-- Shared Core Scripts -->
  <script src="{{ url_for('static', path='js/main.js') }}"></script>

  <!-- Page-Specific Scripts Block -->
  {% block page_js %}{% endblock %}
</body>
</html>
