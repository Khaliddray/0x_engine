<header class="site-header">
  <div class="max-w-6xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
    <!-- Brand Monogram & Name -->
    <div class="flex items-center space-x-3">
      <a href="/" class="flex items-center space-x-3 group">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-brand-600 via-orange-500 to-amber-400 flex items-center justify-center font-bold text-xs font-mono text-black shadow-md group-hover:scale-105 transition-transform">
          YK
        </div>
        <div class="flex items-baseline space-x-2">
          <span class="font-serif font-bold text-base dark:text-white text-slate-900 tracking-tight group-hover:text-brand-500 transition-colors">
            Yahaya Khalid
          </span>
          <span class="hidden md:inline-block text-xs font-mono dark:text-slate-500 text-slate-400">
            / Product Builder &amp; Backend Engineer
          </span>
        </div>
      </a>
    </div>

    <!-- Right Actions: Theme Toggle, Social Links (sm+), and Toggleable Menu Button -->
    <div class="flex items-center space-x-1.5 sm:space-x-2.5">
      <!-- Theme Toggle -->
      <button
        type="button"
        onclick="toggleTheme()"
        title="Toggle Dark / Light Theme"
        class="w-10 h-10 flex items-center justify-center rounded-lg dark:bg-white/5 bg-slate-200/80 dark:text-slate-300 text-slate-700 hover:text-brand-500 dark:border-white/10 border-slate-300 border transition shrink-0"
        aria-label="Toggle visual theme"
      >
        <!-- Sun Icon (shown in dark mode) -->
        <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <!-- Moon Icon (shown in light mode) -->
        <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>

      <!-- GitHub Link (visible on sm+) -->
      <a
        href="https://github.com/Khaliddray"
        target="_blank"
        rel="noopener noreferrer"
        class="w-10 h-10 hidden sm:inline-flex items-center justify-center rounded-lg dark:bg-white/5 bg-slate-200/80 dark:text-slate-300 text-slate-700 hover:text-brand-500 border dark:border-white/10 border-slate-300 transition shrink-0"
        title="View GitHub Profile"
        aria-label="GitHub Profile (opens in a new tab)"
      >
        <svg class="w-4 h-4 inline-block" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"></path>
        </svg>
      </a>

      <!-- LinkedIn Link (visible on sm+) -->
      <a
        href="https://www.linkedin.com/in/yahaya-khalid-198593418"
        target="_blank"
        rel="noopener noreferrer"
        class="w-10 h-10 hidden sm:inline-flex items-center justify-center rounded-lg dark:bg-white/5 bg-slate-200/80 dark:text-slate-300 text-slate-700 hover:text-brand-500 border dark:border-white/10 border-slate-300 transition shrink-0"
        title="View LinkedIn Profile"
        aria-label="LinkedIn Profile (opens in a new tab)"
      >
        <svg class="w-4 h-4 inline-block" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
        </svg>
      </a>

      <!-- X (Twitter) Link (visible on sm+) -->
      <a
        href="https://www.x.com/Zzaq_0x"
        target="_blank"
        rel="noopener noreferrer"
        class="w-10 h-10 hidden sm:inline-flex items-center justify-center rounded-lg dark:bg-white/5 bg-slate-200/80 dark:text-slate-300 text-slate-700 hover:text-brand-500 border dark:border-white/10 border-slate-300 transition shrink-0"
        title="View X (formerly Twitter) Profile"
        aria-label="X (formerly Twitter) Profile (opens in a new tab)"
      >
        <svg class="w-4 h-4 inline-block" fill="currentColor" viewBox="0 0 24 24">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>

      <!-- Menu Toggle Button -->
      <button
        type="button"
        onclick="openNavigationMenu()"
        class="menu-toggle-btn min-h-[40px] px-3.5 sm:px-4"
        aria-expanded="false"
        aria-controls="navigation-panel"
        aria-label="Open navigation menu"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span>Menu</span>
      </button>
    </div>
  </div>
</header>
