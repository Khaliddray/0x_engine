<article class="glass-card product-card rounded-2xl p-6 sm:p-7 flex flex-col justify-between corner-mark relative group transition hover:-translate-y-1">
  <div>
    {% if product.visual_url %}
    <!-- Optional Product Visual Preview -->
    <div class="rounded-xl overflow-hidden mb-5 border dark:border-white/10 border-slate-200 bg-slate-950 aspect-video relative">
      <img
        src="{{ product.visual_url }}"
        alt="{{ product.name }} product preview"
        class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
        loading="lazy"
      />
    </div>
    {% endif %}

    <!-- Product Header -->
    <div class="mb-3">
      <div class="inline-flex items-center space-x-1.5 text-[11px] font-mono text-brand-600 dark:text-brand-400 font-semibold mb-1">
        <span class="w-1.5 h-1.5 rounded-full bg-brand-500"></span>
        <span>Product Showcase</span>
      </div>
      <h2 class="text-xl sm:text-2xl font-serif font-medium dark:text-white text-slate-900 leading-snug">
        {{ product.name }}
      </h2>
    </div>

    <!-- Product Value & Purpose Description -->
    <p class="dark:text-slate-300 text-slate-600 text-xs sm:text-sm leading-relaxed font-sans mb-6">
      {{ product.description }}
    </p>
  </div>

  <!-- Card Action / Status Footer -->
  <div class="pt-4 hairline-t">
    {% if product.product_url %}
    <a
      href="{{ product.product_url }}"
      target="_blank"
      rel="noopener noreferrer"
      class="min-h-[40px] px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-mono text-xs font-semibold inline-flex items-center space-x-1.5 transition shadow-sm shadow-brand-600/20 group/btn"
      aria-label="Explore {{ product.name }} (opens in a new tab)"
    >
      <span>Explore Product</span>
      <svg class="w-3.5 h-3.5 transform group-hover/btn:translate-x-0.5 group-hover/btn:-translate-y-0.5 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
      </svg>
    </a>
    {% else %}
    <div class="flex items-center space-x-2 text-xs font-mono dark:text-slate-500 text-slate-400 py-2">
      <span class="w-1.5 h-1.5 rounded-full bg-slate-400/60 dark:bg-slate-600"></span>
      <span class="text-[11px]">Product in Development</span>
    </div>
    {% endif %}
  </div>
</article>
